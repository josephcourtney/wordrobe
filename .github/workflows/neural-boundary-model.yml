name: Neural boundary model

on:
  pull_request:
    branches:
      - main
    paths:
      - src/wordrobe/_neural_boundary.py
      - src/wordrobe/_neural_scoring.py
      - src/wordrobe/segment.py
      - src/wordrobe/cli.py
      - src/wordrobe/data/DKSPLIT_NOTICE.txt
      - src/wordrobe/data/dksplit-boundaries-v1.npz
      - scripts/__init__.py
      - scripts/convert_dksplit_weights.py
      - scripts/compare_dksplit_onnx.py
      - scripts/evaluate_hybrid_segmentation.py
      - tests/unit/test_neural_boundary.py
      - tests/unit/test_neural_scoring.py
      - tests/**/test_*segment*.py
      - pyproject.toml
      - uv.lock
      - README.md
      - CHANGELOG.md
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/neural-boundary-model.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - name: Set up reference Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install reference dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            uv numpy dksplit==1.0.2 onnx==1.19.0 pytest ruff

      - name: Verify generated model and lockfile
        run: |
          uv lock
          python scripts/convert_dksplit_weights.py
          git diff --exit-code -- uv.lock src/wordrobe/data/dksplit-boundaries-v1.npz

      - name: Check neural sources
        run: |
          python -m compileall -q \
            src/wordrobe/_neural_boundary.py \
            src/wordrobe/_neural_scoring.py \
            src/wordrobe/segment.py \
            src/wordrobe/cli.py \
            scripts/convert_dksplit_weights.py \
            scripts/compare_dksplit_onnx.py \
            scripts/evaluate_hybrid_segmentation.py
          ruff format --check \
            src/wordrobe/_neural_boundary.py \
            src/wordrobe/_neural_scoring.py \
            src/wordrobe/segment.py \
            src/wordrobe/cli.py \
            scripts/convert_dksplit_weights.py \
            scripts/compare_dksplit_onnx.py \
            scripts/evaluate_hybrid_segmentation.py \
            tests/unit/test_neural_boundary.py \
            tests/unit/test_neural_scoring.py \
            tests/component/test_neural_segment.py
          ruff check --no-fix --ignore INP001,S310,PLR0914,PLR0915,PLC2701,E501 \
            src/wordrobe/_neural_boundary.py \
            src/wordrobe/_neural_scoring.py \
            src/wordrobe/segment.py \
            src/wordrobe/cli.py \
            scripts/convert_dksplit_weights.py \
            scripts/compare_dksplit_onnx.py \
            scripts/evaluate_hybrid_segmentation.py \
            tests/unit/test_neural_boundary.py \
            tests/unit/test_neural_scoring.py \
            tests/component/test_neural_segment.py

      - name: Test neural runtime
        run: pytest -q tests/unit/test_neural_boundary.py tests/unit/test_neural_scoring.py tests/component/test_neural_segment.py

      - name: Sweep hybrid neural weights
        run: python scripts/evaluate_hybrid_segmentation.py

      - name: Compare with published ONNX implementation
        run: python scripts/compare_dksplit_onnx.py --weights src/wordrobe/data/dksplit-boundaries-v1.npz

      - name: Set up package Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project development environment
        run: |
          python -m pip install --disable-pip-version-check uv rust-just
          uv sync --extra neural

      - name: Run repository gate
        run: just check

      - name: Verify wheel contains model and attribution
        run: |
          python -m pip wheel --no-deps . -w /tmp/wheels
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path('/tmp/wheels').glob('wordrobe-*.whl'))
          required = {
              'wordrobe/data/dksplit-boundaries-v1.npz',
              'wordrobe/data/DKSPLIT_NOTICE.txt',
          }
          with ZipFile(wheel) as archive:
              missing = required.difference(archive.namelist())
              assert not missing, f'missing from {wheel}: {sorted(missing)}'
          PY
