name: DKSplit NumPy experiment

on:
  pull_request:
    branches:
      - main
    paths:
      - experiments/dksplit_numpy/**
      - .github/workflows/dksplit-numpy-experiment.yml
  workflow_dispatch:

jobs:
  inspect-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install experiment dependencies
        run: python -m pip install --disable-pip-version-check dksplit==1.0.2 onnx==1.19.0

      - name: Compile experiment sources
        run: python -m compileall -q experiments/dksplit_numpy

      - name: Compare both NumPy backends with ONNX Runtime
        run: python experiments/dksplit_numpy/compare.py --random-count 10

      - name: Compare realistic identifier corpus and top-k results
        run: python experiments/dksplit_numpy/realistic_compare.py

      - name: Compare published DKSplit benchmark sample
        run: python experiments/dksplit_numpy/benchmark_compare.py

      - name: Stress practical float32 backend
        run: python experiments/dksplit_numpy/compare.py --random-count 1000 --skip-quantized
