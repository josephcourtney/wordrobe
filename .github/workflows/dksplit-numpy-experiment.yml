name: DKSplit NumPy experiment

on:
  pull_request:
    branches:
      - main
    paths:
      - experiments/dksplit_numpy/**
      - scripts/convert_dksplit_weights.py
      - scripts/compare_dksplit_onnx.py
      - .github/workflows/dksplit-numpy-experiment.yml
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install comparison dependencies
        run: python -m pip install --disable-pip-version-check dksplit==1.0.2 onnx==1.19.0 ruff

      - name: Check experiment sources
        run: |
          python -m compileall -q experiments/dksplit_numpy/runtime.py scripts/convert_dksplit_weights.py scripts/compare_dksplit_onnx.py
          ruff check --no-fix experiments/dksplit_numpy/runtime.py scripts/convert_dksplit_weights.py scripts/compare_dksplit_onnx.py

      - name: Convert published weights
        run: python scripts/convert_dksplit_weights.py --output /tmp/dksplit-numpy.npz

      - name: Compare stripped NumPy runtime with ONNX
        run: python scripts/compare_dksplit_onnx.py --weights /tmp/dksplit-numpy.npz
