[project]
  name = "wordrobe"
  version = "0.1.0"
  description = "A costume change for words."
  readme = "README.md"
  authors = [
    { name = "Joseph Courtney", email = "5942706+josephcourtney@users.noreply.github.com" },
  ]
  requires-python = ">=3.14"
  dependencies = [
    "typer>=0.27.2",
  ]

  [project.optional-dependencies]
    neural = [
      "numpy>=2.0",
    ]

  [project.scripts]
    wordrobe = "wordrobe.cli:app"

[build-system]
  requires      = ["uv_build>=0.8.22,<0.9.0"]
  build-backend = "uv_build"

[dependency-groups]
  dev = [
    "coverage>=7.13.4",
    "import-linter>=2.10",
    "numpy>=2.0",
    "pip-audit>=2.10.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-testmon>=2.2.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "radon>=6.0.1",
    "ruff>=0.15.2",
    "rust-just>=1.46.0",
    "showcov>=0.3.5",
    "ty>=0.0.17",
    "vulture>=2.14",
  ]

[tool.pytest.ini_options]
  pythonpath = ["src"]

[tool.ruff]
  extend = "./ruff.default.toml"

[tool.uv.sources]
  showcov = { git = "https://github.com/josephcourtney/showcov.git", rev = "db8a535b5cb5e36a3557f6559fa15f3cd7f20c0a" }
